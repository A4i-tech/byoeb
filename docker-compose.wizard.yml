# docker-compose.wizard.yml
#
# AshaBot Setup Wizard — no git clone required.
#
# Usage:
#   docker compose -f docker-compose.wizard.yml up
#   Open http://localhost:5001 in your browser.
#
# Requirements: Docker Desktop (https://docs.docker.com/get-docker/)

services:
  wizard:
    image: ghcr.io/a4i-tech/byoeb-wizard:latest
    pull_policy: always
    ports:
      # Loopback-only on purpose: this is a local dev tool, not meant to be reachable remotely.
      - "127.0.0.1:5001:5001"
    volumes:
      # Docker socket: wizard can launch the app containers on your host.
      # This is host-root-equivalent access, run this only on a local dev machine.
      # Wizard also runs as root: it writes to the bind-mounted workspace below, and a non-root user buys nothing given the socket mount above is already host-root-equivalent.
      - /var/run/docker.sock:/var/run/docker.sock
      # Working directory: wizard writes .env.local + docker-compose.app.yml here
      - .:/workspace
    environment:
      # HOST_PWD lets wizard pass your host path to Docker socket commands.
      # Docker Compose always sets PWD in the environment when interpolating.
      HOST_PWD: ${PWD}
      RUNNING_IN_DOCKER: "1"
    extra_hosts:
      # Required on Linux — host.docker.internal is automatic on macOS/Windows only
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
